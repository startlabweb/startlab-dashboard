<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ titulo }} — Start Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--midnight:#121212;--card:#1E1E1E;--gold:#EAB660;--text:#F2F2F2;--muted:#8A8A8A;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--midnight);color:var(--text);font-family:"Red Hat Display",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
  .caja{max-width:560px;text-align:center}
  .marca{font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
  .marca span{color:var(--gold)}
  h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin-bottom:18px}
  p{font-size:19px;line-height:1.6;color:var(--muted)}
  footer{margin-top:40px;font-size:13px;color:#5f5f5f}
</style>
</head>
<body>
<div class="caja">
  <div class="marca">Start <span>Lab</span></div>
  <h1>{{ titulo }}</h1>
  <p>{{ texto }}</p>
  <footer>Start Lab · Business IQ Test</footer>
</div>
</body>
</html>
