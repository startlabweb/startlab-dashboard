{% extends "base.html" %}
{% block title %}Monitor — StartLab{% endblock %}
{% block content %}
<div id="monitor-page" data-monitor-id="{{ monitor_id }}">
    <!-- Header -->
    <div class="flex justify-between items-center mb-2" id="monitor-header">
        <div>
            <h1 class="text-2xl font-bold text-white font-display" id="monitor-title">Cargando...</h1>
            <div class="gold-line w-20 mt-1"></div>
            <!-- El id del sheet es un link: la planilla es el entregable, tiene
                 que estar a un click desde aca -->
            <a id="monitor-sheet-id" href="#" target="_blank" rel="noopener"
               class="text-xs text-gray-600 font-mono mt-2 inline-block hover:text-gold transition-colors"></a>
        </div>
        <div class="flex items-center space-x-3">
            <a id="sheet-link" href="#" target="_blank" rel="noopener" hidden
               class="text-sm border border-midnight-border rounded-md px-3 py-2 text-gray-300 hover:border-gold hover:text-gold transition-colors">📄 Abrir Sheet</a>
            <span id="cost-badge" class="text-sm text-gold"></span>
            <span id="type-badge" class="text-xs font-medium px-2.5 py-0.5 rounded-full"></span>
            <span id="status-badge" class="text-xs font-medium px-2.5 py-0.5 rounded-full"></span>
            <button id="toggle-btn" onclick="toggleMonitor()" class="px-4 py-2 rounded-md text-sm font-semibold transition-colors"></button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="border-b border-midnight-border mb-4 mt-6">
        <nav class="flex space-x-8">
            <button onclick="showTab('candidates')" class="tab-btn border-b-2 border-gold text-gold pb-3 text-sm font-medium" data-tab="candidates">Candidatos</button>
            <button onclick="showTab('activity')" class="tab-btn border-b-2 border-transparent text-gray-500 pb-3 text-sm font-medium hover:text-gray-300 transition-colors" data-tab="activity">Actividad</button>
            <button onclick="showTab('stats')" class="tab-btn border-b-2 border-transparent text-gray-500 pb-3 text-sm font-medium hover:text-gray-300 transition-colors" data-tab="stats">Estadisticas</button>
        </nav>
    </div>

    <!-- Tab: Candidates -->
    <div id="tab-candidates" class="tab-content">
        <!-- Resumen siempre visible: cuantos llenaron el form y en que estado estan -->
        <div id="resumen-candidatos" class="flex flex-wrap items-baseline gap-x-4 gap-y-1 mb-3 text-sm text-gray-400"></div>
        <!-- Filtros por puntaje: la tabla queda en orden de llegada (igual que el
             Sheet); para rankear se filtra, no se reordena — ver trampa #4 del
             monitor de becas: ordenar la hoja real rompe el mapeo por fila. -->
        <div id="filtros-candidatos" class="flex flex-wrap items-center gap-2 mb-3 text-sm">
            <button data-tier="all" onclick="setTier('all')" class="tier-btn px-3 py-1 rounded-full border transition-colors">Todos</button>
            <button data-tier="top" onclick="setTier('top')" class="tier-btn px-3 py-1 rounded-full border transition-colors">🟢 Top 5</button>
            <button data-tier="suplente" onclick="setTier('suplente')" class="tier-btn px-3 py-1 rounded-full border transition-colors">🟠 Suplentes</button>
            <button data-tier="con" onclick="setTier('con')" class="tier-btn px-3 py-1 rounded-full border transition-colors">Con puntaje</button>
            <button data-tier="sin" onclick="setTier('sin')" class="tier-btn px-3 py-1 rounded-full border transition-colors">Sin puntaje</button>
            <label class="flex items-center gap-1.5 ml-2 text-gray-400">Puntaje ≥
                <input id="filtro-min" type="number" min="0" step="1" oninput="onMinChange()"
                       class="w-16 bg-midnight-light border border-midnight-border rounded px-2 py-1 text-white text-sm focus:border-gold focus:outline-none">
            </label>
            <span id="filtro-conteo" class="text-xs text-gray-500 ml-auto"></span>
        </div>
        <!-- overflow-x-auto y no overflow-hidden: si la tabla queda mas ancha que
             la tarjeta (emails largos), se scrollea; hidden recortaba Acciones. -->
        <div class="bg-midnight-card rounded-lg border border-midnight-border overflow-x-auto">
            <table class="min-w-full divide-y divide-midnight-border">
                <thead class="bg-midnight-light">
                    <tr>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Fila</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Nombre</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Email</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Escritas</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider video-only">Video</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Total</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Status</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gold/70 uppercase tracking-wider">Acciones</th>
                    </tr>
                </thead>
                <tbody id="candidates-body" class="divide-y divide-midnight-border/50">
                    <tr><td id="candidates-loading-cell" colspan="7" class="px-4 py-8 text-center text-gray-600">Cargando candidatos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tab: Activity -->
    <div id="tab-activity" class="tab-content hidden">
        <div class="bg-midnight-card rounded-lg border border-midnight-border p-4">
            <div id="activity-feed" class="space-y-2 max-h-96 overflow-y-auto font-mono text-xs"></div>
        </div>
    </div>

    <!-- Tab: Stats -->
    <div id="tab-stats" class="tab-content hidden">
        <div class="grid grid-cols-4 gap-4" id="stats-grid">
            <div class="bg-midnight-card rounded-lg border border-midnight-border p-4">
                <p class="text-xs text-gray-500">Total</p>
                <p class="text-2xl font-bold text-white font-display" id="stat-total">—</p>
            </div>
            <div class="bg-midnight-card rounded-lg border border-midnight-border p-4">
                <p class="text-xs text-gray-500">Completados</p>
                <p class="text-2xl font-bold text-green-400 font-display" id="stat-completed">—</p>
            </div>
            <div class="bg-midnight-card rounded-lg border border-midnight-border p-4">
                <p class="text-xs text-gray-500">Pendientes</p>
                <p class="text-2xl font-bold text-gold font-display" id="stat-pending">—</p>
            </div>
            <div class="bg-midnight-card rounded-lg border border-midnight-border p-4">
                <p class="text-xs text-gray-500">Costo Total</p>
                <p class="text-2xl font-bold text-gray-400 font-display" id="stat-cost">—</p>
            </div>
        </div>
    </div>

    <!-- Candidate detail modal -->
    <div id="candidate-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center">
        <div class="bg-midnight-card rounded-lg border border-midnight-border max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-white font-display" id="modal-title"></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gold text-xl transition-colors">&times;</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>
</div>

<script>
const monitorId = '{{ monitor_id }}';
let monitorData = null;

async function loadMonitor() {
    const res = await fetch(`/api/monitors/${monitorId}`);
    monitorData = await res.json();
    renderHeader();
    loadCandidates();
    loadActivity();
}

function renderHeader() {
    const m = monitorData;
    document.getElementById('monitor-title').textContent = m.sheet_title || 'Monitor';
    document.getElementById('monitor-sheet-id').textContent = m.sheet_id;
    document.getElementById('cost-badge').textContent = `$${parseFloat(m.total_cost_usd || 0).toFixed(2)}`;

    // Link a la planilla: usa la URL guardada o la arma desde el id
    const sheetUrl = m.sheet_url || `https://docs.google.com/spreadsheets/d/${m.sheet_id}`;
    document.getElementById('monitor-sheet-id').href = sheetUrl;
    const sheetBtn = document.getElementById('sheet-link');
    sheetBtn.href = sheetUrl;
    sheetBtn.hidden = false;

    // Type badge
    const typeBadge = document.getElementById('type-badge');
    const isEditor = m.evaluator_type === 'editor';
    if (isEditor) {
        typeBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-blue-900/40 text-blue-300 border border-blue-800';
        typeBadge.textContent = 'Editor';
    } else {
        typeBadge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-gold/10 text-gold border border-gold/30';
        typeBadge.textContent = 'Sales';
    }

    // Hide video column for editor monitors
    document.querySelectorAll('.video-only').forEach(el => {
        el.classList.toggle('hidden', isEditor);
    });
    const loadingCell = document.getElementById('candidates-loading-cell');
    if (loadingCell) loadingCell.colSpan = isEditor ? 6 : 7;

    const badge = document.getElementById('status-badge');
    const btn = document.getElementById('toggle-btn');

    if (m.status === 'active') {
        badge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-green-900/40 text-green-400 border border-green-800';
        badge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-green-400 mr-1 pulse-dot"></span>Activo';
        btn.textContent = 'Pausar';
        btn.className = 'px-4 py-2 rounded-md text-sm font-semibold bg-midnight-light border border-gold/50 text-gold hover:bg-gold hover:text-midnight transition-colors';
    } else {
        badge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-midnight-light text-gray-400 border border-midnight-border';
        badge.textContent = 'Pausado';
        btn.textContent = 'Activar';
        btn.className = 'px-4 py-2 rounded-md text-sm font-semibold bg-gold text-midnight hover:bg-gold-dark transition-colors';
    }

    const c = m.counts || {};
    document.getElementById('stat-total').textContent = c.total || 0;
    document.getElementById('stat-completed').textContent = c.completed || 0;
    document.getElementById('stat-pending').textContent = c.pending || 0;
    document.getElementById('stat-cost').textContent = `$${parseFloat(m.total_cost_usd || 0).toFixed(2)}`;
}

async function toggleMonitor() {
    const action = monitorData.status === 'active' ? 'stop' : 'start';
    try {
        const res = await fetch(`/api/monitors/${monitorId}/${action}`, {method: 'POST'});
        if (!res.ok) {
            const data = await res.json();
            alert(data.detail || 'Error');
            return;
        }
        loadMonitor();
    } catch (e) { alert(e.message); }
}

// El texto de las razones viene del formulario del postulante o de una
// excepcion: siempre se escapa antes de meterlo al HTML.
function esc(s) {
    return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Barra de resumen sobre la tabla: la pregunta #1 del equipo es "cuanta gente
// lleno el form", y no deberia hacer falta ir al tab de estadisticas para verla.
function renderResumen(counts, candidates) {
    const el = document.getElementById('resumen-candidatos');
    if (!el || !counts) return;
    const sinVideo = (candidates || []).filter(c => c.video_status === 'no_video').length;
    const enProceso = (counts.pending || 0) + (counts.processing || 0);
    let html = `<span class="text-xl font-bold text-white font-display">${counts.total || 0}</span>` +
        `<span class="text-gray-400">aplicantes (forms llenados)</span>`;
    const partes = [];
    if (counts.completed) partes.push(`<span class="text-green-400">${counts.completed} completados</span>`);
    if (counts.error) partes.push(`<span class="text-red-400">${counts.error} con error</span>`);
    if (sinVideo) partes.push(`<span class="text-gold">${sinVideo} sin video</span>`);
    if (enProceso) partes.push(`<span class="text-gray-500">${enProceso} en proceso</span>`);
    if (partes.length) html += `<span class="text-gray-600">·</span>` + partes.join(`<span class="text-gray-600 mx-1">·</span>`);
    el.innerHTML = html;
}

// Filtros de la tabla: el orden siempre es el del Sheet (llegada); estos solo
// esconden filas. Los cortes de top 5 / suplente se calculan SIEMPRE sobre la
// lista completa, no sobre lo filtrado, para que el badge no cambie al filtrar.
let candidatesCache = null;
const filtro = { tier: 'all', min: null };

function setTier(t) {
    filtro.tier = filtro.tier === t ? 'all' : t; // segundo click = destildar
    renderCandidates();
}

function onMinChange() {
    const v = document.getElementById('filtro-min').value;
    filtro.min = v === '' ? null : Number(v);
    renderCandidates();
}

function pintarFiltros() {
    document.querySelectorAll('.tier-btn').forEach(btn => {
        const activo = btn.dataset.tier === filtro.tier;
        btn.className = 'tier-btn px-3 py-1 rounded-full border transition-colors ' + (activo
            ? 'border-gold text-gold bg-gold/10'
            : 'border-midnight-border text-gray-400 hover:text-gold hover:border-gold/50');
    });
}

function pasaFiltro(c, corteBeca, corteSuplente) {
    const t = c.total_score;
    if (filtro.min != null && (t == null || t < filtro.min)) return false;
    switch (filtro.tier) {
        case 'top': return t != null && corteBeca != null && t >= corteBeca;
        case 'suplente': return t != null && corteSuplente != null && t === corteSuplente;
        case 'con': return t != null;
        case 'sin': return t == null;
        default: return true;
    }
}

async function loadCandidates() {
    const res = await fetch(`/api/monitors/${monitorId}/candidates`);
    candidatesCache = await res.json();
    renderCandidates();
}

function renderCandidates() {
    const data = candidatesCache;
    if (!data) return;
    const tbody = document.getElementById('candidates-body');

    const isEditor = monitorData && monitorData.evaluator_type === 'editor';
    const colCount = isEditor ? 7 : 8;

    renderResumen(data.counts, data.candidates);
    pintarFiltros();

    if (!data.candidates || data.candidates.length === 0) {
        document.getElementById('filtro-conteo').textContent = '';
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="px-4 py-8 text-center text-gray-600">Sin candidatos aun</td></tr>`;
        return;
    }

    const statusPill = (status) => {
        const colors = {
            completed: 'bg-green-900/40 text-green-400 border border-green-800',
            processing: 'bg-blue-900/40 text-blue-400 border border-blue-800',
            pending: 'bg-midnight-light text-gray-500 border border-midnight-border',
            error: 'bg-red-900/40 text-red-400 border border-red-800',
            no_video: 'bg-gold/10 text-gold border border-gold/30',
        };
        return `<span class="text-xs px-2 py-0.5 rounded-full ${colors[status] || colors.pending}">${status}</span>`;
    };

    // Zonas de beca (mismo criterio que el formato condicional del Sheet):
    // verde = top 5 por puntaje total (empates en el 5º puesto incluidos),
    // durazno = el primer grupo de puntaje justo debajo del corte (suplentes).
    const totales = data.candidates.map(c => c.total_score).filter(t => t != null).sort((a, b) => b - a);
    const corteBeca = totales.length >= 5 ? totales[4] : null;
    const corteSuplente = corteBeca != null ? (totales.find(t => t < corteBeca) ?? null) : null;

    const visibles = data.candidates.filter(c => pasaFiltro(c, corteBeca, corteSuplente));
    const hayFiltro = filtro.tier !== 'all' || filtro.min != null;
    document.getElementById('filtro-conteo').textContent =
        hayFiltro ? `mostrando ${visibles.length} de ${data.candidates.length}` : '';

    if (visibles.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="px-4 py-8 text-center text-gray-600">Ningun candidato pasa el filtro</td></tr>`;
        return;
    }

    let html = '';
    visibles.forEach(c => {
        const overallStatus = (c.written_status === 'error' || c.video_status === 'error') ? 'error' :
            (c.written_status === 'processing' || c.video_status === 'processing') ? 'processing' :
            (c.written_status === 'completed' && (c.video_status === 'completed' || c.video_status === 'no_video')) ? 'completed' : 'pending';

        const ws = c.written_score != null ? c.written_score : '—';
        const vs = c.video_status === 'no_video' ? 'N/A' : (c.video_score != null ? c.video_score : '—');
        // Mismo criterio que el Sheet: total solo cuando las dos fases terminaron.
        const total = c.total_score != null ? c.total_score : '—';
        const canRetry = c.written_status === 'error' || c.video_status === 'error';

        let tierClass = '';
        let tierBadge = '';
        if (c.total_score != null && corteBeca != null) {
            if (c.total_score >= corteBeca) {
                tierClass = ' bg-green-900/25';
                tierBadge = ` <span class="ml-1 text-xs px-1.5 py-0.5 rounded-full whitespace-nowrap bg-green-900/40 text-green-400 border border-green-800">top 5</span>`;
            } else if (corteSuplente != null && c.total_score === corteSuplente) {
                tierClass = ' bg-orange-900/25';
                tierBadge = ` <span class="ml-1 text-xs px-1.5 py-0.5 rounded-full whitespace-nowrap bg-orange-900/40 text-orange-300 border border-orange-800">suplente</span>`;
            }
        }

        // Razones visibles: por que el video quedo en N/A (ej. respondio
        // "no pude hacer el video") y por que una fila esta en error. La
        // version completa queda en el title y en el modal del candidato.
        const razonNA = c.video_status === 'no_video' && c.razon_na
            ? `<div class="text-xs text-gray-500 truncate mt-0.5" style="max-width:170px" title="${esc(c.razon_na)}">${esc(c.razon_na)}</div>` : '';
        const razonError = overallStatus === 'error' && c.razon_error
            ? `<div class="text-xs text-red-400/80 truncate mt-0.5" style="max-width:170px" title="${esc(c.error_message || '')}">${esc(c.razon_error)}</div>` : '';
        const videoCell = isEditor ? '' : `<td class="px-3 py-3 text-sm text-gold">${vs}${razonNA}</td>`;

        // Nombre y email truncados: son las columnas que inflaban la tabla mas
        // alla de la tarjeta y dejaban Acciones fuera de vista. El texto
        // completo queda en el title y en el modal del candidato.
        html += `<tr class="hover:bg-midnight-light/50 cursor-pointer transition-colors${tierClass}" onclick="showCandidate('${c.id}')">
            <td class="px-3 py-3 text-sm text-gray-500">${c.sheet_row}</td>
            <td class="px-3 py-3 text-sm font-medium text-white truncate" style="max-width:170px" title="${esc(c.name || '')}">${esc(c.name) || '—'}</td>
            <td class="px-3 py-3 text-sm text-gray-500 truncate" style="max-width:190px" title="${esc(c.email || '')}">${esc(c.email) || '—'}</td>
            <td class="px-3 py-3 text-sm text-gold">${ws}</td>
            ${videoCell}
            <td class="px-3 py-3 text-sm text-gold font-semibold whitespace-nowrap">${total}${tierBadge}</td>
            <td class="px-3 py-3">${statusPill(overallStatus)}${razonError}</td>
            <td class="px-3 py-3">${canRetry ? `<button onclick="event.stopPropagation(); retryCandidate('${c.id}')" class="text-xs text-gold hover:text-gold-light transition-colors">Reintentar</button>` : ''}</td>
        </tr>`;
    });
    tbody.innerHTML = html;
}

async function loadActivity() {
    const feed = document.getElementById('activity-feed');
    if (monitorData && monitorData.status === 'active') {
        const evtSource = new EventSource(`/api/monitors/${monitorId}/events`);
        evtSource.onmessage = function(e) {
            const event = JSON.parse(e.data);
            const time = new Date().toLocaleTimeString('es', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
            const msg = formatEvent(event);
            feed.innerHTML = `<div class="text-gray-400 fade-in">[${time}] ${msg}</div>` + feed.innerHTML;
            loadCandidates();
        };
    }
}

function formatEvent(e) {
    switch(e.type) {
        case 'new_candidate': return `<span class="text-gold">Nueva respuesta: ${e.name} (fila ${e.row})</span>`;
        case 'processing': return `<span class="text-gray-400">Procesando ${e.phase}: ${e.name}...</span>`;
        case 'downloaded': return `<span class="text-gray-400">Video descargado: ${e.name}</span>`;
        case 'transcribed': return `<span class="text-gray-400">Transcripcion completa: ${e.name} (${e.duration}s)</span>`;
        case 'written_complete': return `<span class="text-green-400">Escritas: ${e.name} — ${e.score}/${e.total}</span>`;
        case 'video_complete': return `<span class="text-green-400">Video: ${e.name} — ${e.score}/${e.total} ($${e.cost})</span>`;
        case 'error': return `<span class="text-red-400">Error (${e.phase}): ${e.name} — ${e.error}</span>`;
        default: return JSON.stringify(e);
    }
}

async function showCandidate(id) {
    const res = await fetch(`/api/monitors/${monitorId}/candidates/${id}`);
    const c = await res.json();

    document.getElementById('modal-title').textContent = c.name || 'Candidato';
    let html = `<div class="space-y-4">`;

    // Written
    html += `<div class="border border-midnight-border rounded-md p-3">
        <h4 class="font-medium text-sm text-gold mb-2">Evaluacion Escritas</h4>
        <p class="text-lg font-bold text-white font-display">${c.written_score != null ? c.written_score + ' pts' : 'Pendiente'}</p>
        <p class="text-sm text-gray-400 mt-1">${c.written_explanation || ''}</p>`;
    if (c.written_breakdown) {
        html += '<div class="mt-2 text-xs text-gray-500">';
        Object.entries(c.written_breakdown).forEach(([k, v]) => {
            if (k.includes('reason') || k.includes('razon')) html += `<p class="mt-1">${v}</p>`;
        });
        html += '</div>';
    }
    html += '</div>';

    const isEditor = monitorData && monitorData.evaluator_type === 'editor';

    // Video (only for sales evaluators)
    if (!isEditor) {
        html += `<div class="border border-midnight-border rounded-md p-3">
            <h4 class="font-medium text-sm text-gold mb-2">Evaluacion Video</h4>`;
        if (c.video_status === 'no_video') {
            html += `<p class="text-sm text-gold/70">Sin video${c.razon_na ? ' — ' + esc(c.razon_na) : ''}</p>`;
            if (c.video_url) {
                html += `<p class="text-xs text-gray-500 mt-1">Lo que puso en el formulario: ${esc(c.video_url)}</p>`;
            }
        } else {
            html += `<p class="text-lg font-bold text-white font-display">${c.video_score != null ? c.video_score + ' pts' : 'Pendiente'}</p>
            <p class="text-sm text-gray-400 mt-1">${c.video_explanation || ''}</p>`;
            if (c.video_breakdown) {
                html += '<div class="mt-2 text-xs text-gray-500">';
                Object.entries(c.video_breakdown).forEach(([k, v]) => {
                    if (k.includes('reason') || k.includes('razon')) html += `<p class="mt-1">${v}</p>`;
                });
                html += '</div>';
            }
        }
        html += '</div>';

        // Transcript
        if (c.transcript) {
            html += `<div class="border border-midnight-border rounded-md p-3">
                <h4 class="font-medium text-sm text-gold mb-2">Transcripcion</h4>
                <div class="text-xs text-gray-500 max-h-48 overflow-y-auto whitespace-pre-wrap">${c.transcript}</div>
            </div>`;
        }
    }

    // Error
    if (c.error_message) {
        html += `<div class="bg-wine/20 border border-wine rounded-md p-3">
            <p class="text-sm text-red-400">${c.error_message}</p>
        </div>`;
    }

    html += '</div>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('candidate-modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('candidate-modal').classList.add('hidden'); }

async function retryCandidate(id) {
    await fetch(`/api/monitors/${monitorId}/candidates/${id}/retry`, {method: 'POST'});
    loadCandidates();
}

function showTab(name) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.replace('border-gold', 'border-transparent');
        el.classList.replace('text-gold', 'text-gray-500');
    });
    document.getElementById('tab-' + name).classList.remove('hidden');
    const btn = document.querySelector(`[data-tab="${name}"]`);
    btn.classList.replace('border-transparent', 'border-gold');
    btn.classList.replace('text-gray-500', 'text-gold');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

loadMonitor();
setInterval(loadMonitor, 30000);
</script>
{% endblock %}
