{% extends "base.html" %}
{% block title %}StartLab Dashboard{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-white font-display">Monitores de Evaluacion</h1>
    <div class="gold-line w-24 mt-2"></div>
    <p class="text-sm text-gray-500 mt-3">Cada monitor vigila un Google Sheet y evalua automaticamente nuevas respuestas.</p>
</div>

<div id="monitors-list" hx-get="/api/monitors" hx-trigger="load, recargar-monitores" hx-swap="innerHTML" hx-request='{"timeout": 30000}'>
    <!-- Skeleton: se ve SIEMPRE mientras carga, no depende de htmx-indicator -->
    <div class="grid gap-4">
        <div class="bg-midnight-card rounded-lg border border-midnight-border p-5 animate-pulse">
            <div class="h-4 bg-midnight-border rounded w-2/5"></div>
            <div class="h-2.5 bg-midnight-border/60 rounded w-3/5 mt-3"></div>
            <div class="h-2.5 bg-midnight-border/40 rounded w-4/5 mt-4"></div>
        </div>
        <div class="bg-midnight-card rounded-lg border border-midnight-border p-5 animate-pulse">
            <div class="h-4 bg-midnight-border rounded w-1/3"></div>
            <div class="h-2.5 bg-midnight-border/60 rounded w-3/5 mt-3"></div>
            <div class="h-2.5 bg-midnight-border/40 rounded w-4/5 mt-4"></div>
        </div>
        <p class="text-center text-xs text-gray-600">Cargando monitores...</p>
    </div>
</div>

<script>
function mostrarErrorMonitores(container, detalle) {
    container.innerHTML = `
        <div class="text-center py-16 bg-midnight-card rounded-lg border border-red-900/60">
            <p class="text-red-400 font-semibold mb-1">No se pudieron cargar los monitores</p>
            <p class="text-xs text-gray-500 mb-4">${detalle}</p>
            <button id="reintentar-monitores" class="bg-gold text-midnight font-semibold px-4 py-2 rounded-md hover:bg-gold-dark transition-colors">Reintentar</button>
        </div>`;
    const boton = container.querySelector('#reintentar-monitores');
    if (boton) {
        boton.addEventListener('click', function() {
            container.innerHTML = '<p class="text-center py-12 text-xs text-gray-600">Cargando monitores...</p>';
            htmx.trigger(container, 'recargar-monitores');
        });
    }
}

// Si la request falla o se pasa del timeout, antes quedaba la pagina en blanco
// para siempre (el JSON.parse tiraba excepcion y nadie la agarraba).
document.body.addEventListener('htmx:timeout', function(evt) {
    if (evt.detail.target.id === 'monitors-list') {
        mostrarErrorMonitores(evt.detail.target, 'El servidor tardo mas de 30 segundos en responder.');
    }
});

document.body.addEventListener('htmx:sendError', function(evt) {
    if (evt.detail.target.id === 'monitors-list') {
        mostrarErrorMonitores(evt.detail.target, 'No hubo conexion con el servidor.');
    }
});

document.body.addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.target.id === 'monitors-list') {
        const container = evt.detail.target;

        if (!evt.detail.successful) {
            mostrarErrorMonitores(container, `El servidor respondio ${evt.detail.xhr.status || 'con un error'}.`);
            return;
        }

        let data;
        try {
            data = JSON.parse(evt.detail.xhr.responseText);
        } catch (e) {
            mostrarErrorMonitores(container, 'La respuesta del servidor no se pudo leer.');
            return;
        }

        if (data.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 bg-midnight-card rounded-lg border-2 border-dashed border-midnight-border">
                    <p class="text-gray-500 mb-4">No hay monitores configurados</p>
                    <a href="/monitors/new" class="bg-gold text-midnight font-semibold px-4 py-2 rounded-md hover:bg-gold-dark transition-colors">Crear primer monitor</a>
                </div>`;
            return;
        }

        let html = '<div class="grid gap-4">';
        data.forEach(m => {
            const statusColors = {
                active: 'bg-green-900/40 text-green-400 border border-green-800',
                paused: 'bg-midnight-card text-gray-400 border border-midnight-border',
                error: 'bg-red-900/40 text-red-400 border border-red-800'
            };
            const statusColor = statusColors[m.status] || statusColors.paused;
            const counts = m.counts || {};
            const cost = parseFloat(m.total_cost_usd || 0).toFixed(2);

            const isEditor = m.evaluator_type === 'editor';
            const typeColor = isEditor
                ? 'bg-blue-900/40 text-blue-300 border border-blue-800'
                : 'bg-gold/10 text-gold border border-gold/30';
            const typeLabel = isEditor ? 'Editor' : 'Sales';

            html += `
            <a href="/monitors/${m.id}" class="block bg-midnight-card rounded-lg border border-midnight-border p-5 hover:border-gold/50 hover:shadow-lg hover:shadow-gold/5 transition-all">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-semibold text-white font-display">${m.sheet_title || 'Sin titulo'}</h3>
                        <p class="text-xs text-gray-600 mt-0.5 font-mono">${m.sheet_id}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-medium px-2.5 py-0.5 rounded-full ${typeColor}">${typeLabel}</span>
                        <span class="text-xs font-medium px-2.5 py-0.5 rounded-full ${statusColor}">${m.status}</span>
                    </div>
                </div>
                <div class="gold-line w-full mt-3 opacity-20"></div>
                <div class="mt-3 flex items-center space-x-6 text-sm">
                    <span class="text-gray-400">Total: ${counts.total || 0}</span>
                    <span class="text-green-400">Completados: ${counts.completed || 0}</span>
                    <span class="text-gold">Pendientes: ${counts.pending || 0}</span>
                    <span class="text-red-400">Errores: ${counts.error || 0}</span>
                    <span class="text-gray-600">Costo: $${cost}</span>
                </div>
            </a>`;
        });
        html += '</div>';
        container.innerHTML = html;
    }
});
</script>
{% endblock %}
